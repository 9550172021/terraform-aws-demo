name: Terraform Checks

on:
  pull_request:
  push:

jobs:

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Find Terraform Directories
        run: |
          find . -type f -name "*.tf" | xargs -n1 dirname | sort -u > tf_dirs.txt

      - name: Terraform Validate
        run: |
          while read dir; do
            echo "Processing $dir"
            cd "$dir"
            terraform init -input=false
            terraform validate
            cd -
          done < tf_dirs.txt

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: terraform-validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Find Terraform Directories
        run: |
          find . -type f -name "*.tf" | xargs -n1 dirname | sort -u > tf_dirs.txt

      - name: Terraform Plan
        run: |
          while read dir; do
            echo "Running plan for $dir"
            cd "$dir"
            terraform init -input=false
            terraform plan -no-color || true
            cd -
          done < tf_dirs.txt

  trivy-security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master